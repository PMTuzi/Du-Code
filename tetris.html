<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块 Tetris</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    user-select: none;
  }
  .game-container {
    display: flex;
    gap: 24px;
    padding: 20px;
  }
  .board-wrapper {
    position: relative;
    padding: 12px;
    background: rgba(0,0,0,0.4);
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(120, 120, 255, 0.3);
  }
  canvas#board {
    display: block;
    background: #1a1a2e;
    border: 2px solid #4a4a6a;
    border-radius: 4px;
  }
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 180px;
  }
  .panel-box {
    background: rgba(0,0,0,0.4);
    padding: 14px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(120, 120, 255, 0.2);
  }
  .panel-box h3 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #8a8aff;
    margin-bottom: 10px;
    text-align: center;
  }
  .panel-box .value {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    color: #fff;
  }
  canvas#next, canvas#hold {
    display: block;
    margin: 0 auto;
    background: #1a1a2e;
    border: 1px solid #4a4a6a;
    border-radius: 4px;
  }
  .controls {
    font-size: 12px;
    line-height: 1.8;
    color: #aaa;
  }
  .controls kbd {
    background: #333;
    border: 1px solid #555;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 11px;
    color: #ddd;
  }
  .btn {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(118, 75, 162, 0.5); }
  .btn:active { transform: translateY(0); }

  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.75);
    border-radius: 8px;
    backdrop-filter: blur(3px);
  }
  .overlay h2 { font-size: 32px; margin-bottom: 10px; color: #fff; }
  .overlay p { font-size: 16px; margin-bottom: 20px; color: #ccc; }
  .hidden { display: none !important; }

  /* Flash clear effect */
  @keyframes flash {
    0%, 100% { background: transparent; }
    50% { background: #fff; }
  }

  /* Mobile controls */
  .mobile-controls {
    display: none;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
    justify-content: center;
    margin-top: 16px;
  }
  .mobile-controls button {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
  }
  .mobile-controls button:active { background: rgba(255,255,255,0.3); }

  @media (max-width: 700px) {
    .game-container { flex-direction: column; align-items: center; }
    .side-panel { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .panel-box { min-width: 120px; }
    .mobile-controls { display: grid; }
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="board-wrapper">
    <canvas id="board" width="300" height="600"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title">俄罗斯方块</h2>
      <p id="overlay-msg">按 Enter 或点击开始</p>
      <button class="btn" id="start-btn">开始游戏</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-box">
      <h3>分数</h3>
      <div class="value" id="score">0</div>
    </div>
    <div class="panel-box">
      <h3>等级</h3>
      <div class="value" id="level">1</div>
    </div>
    <div class="panel-box">
      <h3>消除行</h3>
      <div class="value" id="lines">0</div>
    </div>
    <div class="panel-box">
      <h3>下一个</h3>
      <canvas id="next" width="100" height="100"></canvas>
    </div>
    <div class="panel-box">
      <h3>暂存 (C)</h3>
      <canvas id="hold" width="100" height="100"></canvas>
    </div>
    <div class="panel-box controls">
      <h3>操作</h3>
      <div><kbd>←</kbd> <kbd>→</kbd> 移动</div>
      <div><kbd>↓</kbd> 软降</div>
      <div><kbd>↑</kbd> 旋转</div>
      <div><kbd>Space</kbd> 硬降</div>
      <div><kbd>C</kbd> 暂存</div>
      <div><kbd>P</kbd> 暂停</div>
    </div>
  </div>
</div>

<!-- Mobile controls -->
<div class="mobile-controls" id="mobile-controls">
  <button data-act="rotate">↻</button>
  <button data-act="hold">C</button>
  <button data-act="hard">⤓</button>
  <button data-act="left">←</button>
  <button data-act="down">↓</button>
  <button data-act="right">→</button>
</div>

<script>
// ========== Tetris Game ==========
const COLS = 10;
const ROWS = 20;
const BLOCK = 30;

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next');
const nextCtx = nextCanvas.getContext('2d');
const holdCanvas = document.getElementById('hold');
const holdCtx = holdCanvas.getContext('2d');

const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const linesEl = document.getElementById('lines');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayMsg = document.getElementById('overlay-msg');
const startBtn = document.getElementById('start-btn');

// Tetromino shapes
const SHAPES = {
  I: [[1,1,1,1]],
  O: [[1,1],[1,1]],
  T: [[0,1,0],[1,1,1]],
  S: [[0,1,1],[1,1,0]],
  Z: [[1,1,0],[0,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]]
};

const COLORS = {
  I: '#00f0f0',
  O: '#f0f000',
  T: '#a000f0',
  S: '#00f000',
  Z: '#f00000',
  J: '#0000f0',
  L: '#f0a000'
};

let board = [];
let currentPiece = null;
let nextPiece = null;
let holdPiece = null;
let canHold = true;
let score = 0;
let level = 1;
let lines = 0;
let dropInterval = 1000;
let lastDrop = 0;
let gameRunning = false;
let gamePaused = false;
let gameOver = false;
let rafId = null;

function createBoard() {
  board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

function rotate(matrix) {
  const rows = matrix.length;
  const cols = matrix[0].length;
  const result = Array.from({ length: cols }, () => Array(rows).fill(0));
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      result[c][rows - 1 - r] = matrix[r][c];
    }
  }
  return result;
}

function randomPiece() {
  const keys = Object.keys(SHAPES);
  const type = keys[Math.floor(Math.random() * keys.length)];
  return {
    type,
    shape: SHAPES[type].map(row => [...row]),
    color: COLORS[type],
    x: Math.floor(COLS / 2) - Math.ceil(SHAPES[type][0].length / 2),
    y: 0
  };
}

function collide(piece, offsetX = 0, offsetY = 0, shape = null) {
  const s = shape || piece.shape;
  for (let r = 0; r < s.length; r++) {
    for (let c = 0; c < s[r].length; c++) {
      if (!s[r][c]) continue;
      const nx = piece.x + c + offsetX;
      const ny = piece.y + r + offsetY;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && board[ny][nx]) return true;
    }
  }
  return false;
}

function merge(piece) {
  for (let r = 0; r < piece.shape.length; r++) {
    for (let c = 0; c < piece.shape[r].length; c++) {
      if (piece.shape[r][c]) {
        const ny = piece.y + r;
        const nx = piece.x + c;
        if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS) {
          board[ny][nx] = piece.color;
        }
      }
    }
  }
}

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(cell => cell !== null)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(null));
      cleared++;
      r++;
    }
  }
  if (cleared > 0) {
    const points = [0, 100, 300, 500, 800][cleared] * level;
    score += points;
    lines += cleared;
    const newLevel = Math.floor(lines / 10) + 1;
    if (newLevel !== level) {
      level = newLevel;
      dropInterval = Math.max(80, 1000 - (level - 1) * 80);
    }
    updateUI();
  }
}

function getGhostY(piece) {
  let gy = 0;
  while (!collide(piece, 0, gy + 1)) gy++;
  return piece.y + gy;
}

function drawBlock(context, x, y, color, size = BLOCK, ghost = false) {
  if (ghost) {
    context.strokeStyle = color;
    context.lineWidth = 2;
    context.globalAlpha = 0.3;
    context.strokeRect(x * size + 1, y * size + 1, size - 2, size - 2);
    context.globalAlpha = 1;
    return;
  }
  // Main fill
  context.fillStyle = color;
  context.fillRect(x * size, y * size, size, size);
  // Highlight
  context.fillStyle = 'rgba(255,255,255,0.3)';
  context.fillRect(x * size, y * size, size, 4);
  context.fillRect(x * size, y * size, 4, size);
  // Shadow
  context.fillStyle = 'rgba(0,0,0,0.3)';
  context.fillRect(x * size + size - 4, y * size, 4, size);
  context.fillRect(x * size, y * size + size - 4, size, 4);
  // Border
  context.strokeStyle = 'rgba(0,0,0,0.5)';
  context.lineWidth = 1;
  context.strokeRect(x * size + 0.5, y * size + 0.5, size - 1, size - 1);
}

function draw() {
  // Clear
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * BLOCK, 0);
    ctx.lineTo(i * BLOCK, canvas.height);
    ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath();
    ctx.moveTo(0, i * BLOCK);
    ctx.lineTo(canvas.width, i * BLOCK);
    ctx.stroke();
  }

  // Placed blocks
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) drawBlock(ctx, c, r, board[r][c]);
    }
  }

  // Ghost piece
  if (currentPiece) {
    const gy = getGhostY(currentPiece);
    for (let r = 0; r < currentPiece.shape.length; r++) {
      for (let c = 0; c < currentPiece.shape[r].length; c++) {
        if (currentPiece.shape[r][c]) {
          drawBlock(ctx, currentPiece.x + c, gy + r, currentPiece.color, BLOCK, true);
        }
      }
    }
  }

  // Current piece
  if (currentPiece) {
    for (let r = 0; r < currentPiece.shape.length; r++) {
      for (let c = 0; c < currentPiece.shape[r].length; c++) {
        if (currentPiece.shape[r][c]) {
          drawBlock(ctx, currentPiece.x + c, currentPiece.y + r, currentPiece.color);
        }
      }
    }
  }
}

function drawMini(context, piece, size = 20) {
  context.fillStyle = '#1a1a2e';
  context.fillRect(0, 0, context.canvas.width, context.canvas.height);
  if (!piece) return;
  const shape = piece.shape;
  const offsetX = (context.canvas.width - shape[0].length * size) / 2;
  const offsetY = (context.canvas.height - shape.length * size) / 2;
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (shape[r][c]) {
        context.fillStyle = piece.color;
        context.fillRect(offsetX + c * size, offsetY + r * size, size, size);
        context.fillStyle = 'rgba(255,255,255,0.3)';
        context.fillRect(offsetX + c * size, offsetY + r * size, size, 3);
        context.fillRect(offsetX + c * size, offsetY + r * size, 3, size);
        context.fillStyle = 'rgba(0,0,0,0.5)';
        context.strokeRect(offsetX + c * size + 0.5, offsetY + r * size + 0.5, size - 1, size - 1);
      }
    }
  }
}

function updateUI() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  linesEl.textContent = lines;
  drawMini(nextCtx, nextPiece);
  drawMini(holdCtx, holdPiece);
}

function spawn() {
  currentPiece = nextPiece || randomPiece();
  nextPiece = randomPiece();
  canHold = true;
  if (collide(currentPiece)) {
    endGame();
  }
  updateUI();
}

function move(dx) {
  if (!currentPiece || gamePaused || gameOver) return;
  if (!collide(currentPiece, dx, 0)) {
    currentPiece.x += dx;
  }
}

function softDrop() {
  if (!currentPiece || gamePaused || gameOver) return;
  if (!collide(currentPiece, 0, 1)) {
    currentPiece.y++;
    score += 1;
    updateUI();
  } else {
    lockPiece();
  }
}

function hardDrop() {
  if (!currentPiece || gamePaused || gameOver) return;
  let dist = 0;
  while (!collide(currentPiece, 0, dist + 1)) dist++;
  currentPiece.y += dist;
  score += dist * 2;
  updateUI();
  lockPiece();
}

function rotatePiece() {
  if (!currentPiece || gamePaused || gameOver) return;
  const rotated = rotate(currentPiece.shape);
  // Wall kicks
  const kicks = [0, -1, 1, -2, 2];
  for (const kick of kicks) {
    if (!collide(currentPiece, kick, 0, rotated)) {
      currentPiece.x += kick;
      currentPiece.shape = rotated;
      return;
    }
  }
}

function hold() {
  if (!currentPiece || !canHold || gamePaused || gameOver) return;
  canHold = false;
  if (holdPiece) {
    const swapped = holdPiece;
    holdPiece = { ...currentPiece, shape: SHAPES[currentPiece.type].map(r => [...r]), x: 0, y: 0 };
    currentPiece = swapped;
    currentPiece.x = Math.floor(COLS / 2) - Math.ceil(currentPiece.shape[0].length / 2);
    currentPiece.y = 0;
    if (collide(currentPiece)) endGame();
  } else {
    holdPiece = { ...currentPiece, shape: SHAPES[currentPiece.type].map(r => [...r]), x: 0, y: 0 };
    spawn();
  }
  updateUI();
}

function lockPiece() {
  merge(currentPiece);
  clearLines();
  spawn();
}

function endGame() {
  gameOver = true;
  gameRunning = false;
  overlay.classList.remove('hidden');
  overlayTitle.textContent = '游戏结束';
  overlayMsg.textContent = `最终得分: ${score}`;
  startBtn.textContent = '重新开始';
  if (rafId) cancelAnimationFrame(rafId);
}

function gameLoop(timestamp) {
  if (!gameRunning || gamePaused || gameOver) return;
  if (timestamp - lastDrop > dropInterval) {
    if (!collide(currentPiece, 0, 1)) {
      currentPiece.y++;
    } else {
      lockPiece();
    }
    lastDrop = timestamp;
  }
  draw();
  rafId = requestAnimationFrame(gameLoop);
}

function startGame() {
  createBoard();
  score = 0;
  level = 1;
  lines = 0;
  dropInterval = 1000;
  holdPiece = null;
  nextPiece = randomPiece();
  gameOver = false;
  gamePaused = false;
  gameRunning = true;
  overlay.classList.add('hidden');
  spawn();
  updateUI();
  lastDrop = performance.now();
  rafId = requestAnimationFrame(gameLoop);
}

function togglePause() {
  if (!gameRunning || gameOver) return;
  gamePaused = !gamePaused;
  if (gamePaused) {
    overlay.classList.remove('hidden');
    overlayTitle.textContent = '暂停';
    overlayMsg.textContent = '按 P 继续';
    startBtn.textContent = '继续游戏';
  } else {
    overlay.classList.add('hidden');
    lastDrop = performance.now();
    rafId = requestAnimationFrame(gameLoop);
  }
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (!gameRunning && (e.key === 'Enter' || e.key === ' ')) {
    startGame();
    return;
  }
  if (e.key === 'p' || e.key === 'P') {
    togglePause();
    return;
  }
  if (gamePaused || gameOver) return;
  switch (e.key) {
    case 'ArrowLeft': e.preventDefault(); move(-1); break;
    case 'ArrowRight': e.preventDefault(); move(1); break;
    case 'ArrowDown': e.preventDefault(); softDrop(); break;
    case 'ArrowUp': e.preventDefault(); rotatePiece(); break;
    case ' ': e.preventDefault(); hardDrop(); break;
    case 'c': case 'C': hold(); break;
  }
  draw();
});

// Start button
startBtn.addEventListener('click', () => {
  if (gamePaused) {
    togglePause();
  } else {
    startGame();
  }
});

// Mobile controls
document.querySelectorAll('#mobile-controls button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (gamePaused || gameOver) return;
    const act = btn.dataset.act;
    if (act === 'left') move(-1);
    else if (act === 'right') move(1);
    else if (act === 'down') softDrop();
    else if (act === 'hard') hardDrop();
    else if (act === 'rotate') rotatePiece();
    else if (act === 'hold') hold();
    draw();
  });
});

// Initial draw
createBoard();
draw();
drawMini(nextCtx, null);
drawMini(holdCtx, null);
</script>
</body>
</html>
